<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="panel">
      <header>
        <h1>Claude Photoshop Bridge</h1>
        <p id="status" class="status">初始化中…</p>
      </header>

      <div class="actions">
        <sp-button id="btn-create-test-layer" variant="cta">建立測試圖層</sp-button>
        <sp-button id="btn-doc-info" variant="secondary" quiet>檢查目前文件</sp-button>
        <sp-button id="btn-inspect" variant="secondary">輸出圖層結構</sp-button>
        <sp-button id="btn-find-fonts" variant="secondary">搜尋 Sansation 字型</sp-button>
      </div>

      <section class="bridge">
        <div class="bridge-row">
          <sp-button id="btn-bridge-toggle" variant="cta">啟動 Claude 橋接</sp-button>
          <sp-action-button id="btn-bridge-folder" quiet>選資料夾</sp-action-button>
        </div>
        <p id="bridge-status" class="status">橋接：未啟動</p>
      </section>

      <section class="runner">
        <label for="command-input">貼上 command JSON</label>
        <textarea id="command-input" rows="5" spellcheck="false"
          placeholder='{ "action": "inspectDocument" }'></textarea>
        <sp-button id="btn-run" variant="cta" quiet>執行 command</sp-button>
      </section>

      <section class="log-section">
        <div class="log-header">
          <span>Console</span>
          <sp-action-button id="btn-clear-log" quiet>清除</sp-action-button>
        </div>
        <div id="log" class="log"></div>
      </section>
    </div>

    <script src="index.js"></script>
  </body>
</html>
