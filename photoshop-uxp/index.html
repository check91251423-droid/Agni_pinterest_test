<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="panel">
      <header>
        <h1>Claude Photoshop Bridge</h1>
        <p id="status" class="status">初始化中…</p>
      </header>

      <div class="actions">
        <sp-button id="btn-create-test-layer" variant="cta">建立測試圖層</sp-button>
        <sp-button id="btn-doc-info" variant="secondary" quiet>檢查目前文件</sp-button>
      </div>

      <section class="log-section">
        <div class="log-header">
          <span>Console</span>
          <sp-action-button id="btn-clear-log" quiet>清除</sp-action-button>
        </div>
        <div id="log" class="log"></div>
      </section>
    </div>

    <script src="index.js"></script>
  </body>
</html>
